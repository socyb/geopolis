<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" width="1000" height="570" font-family="Liberation Sans, Arial, Helvetica, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">La red global de los chips en cuatro pasos</title>
  <desc id="d">Diseño, herramientas EDA, fabricación y prueba y empacado, con las empresas y los países que controlan cada paso según Rodríguez Urbina (2023), pp. 57—61. Estados Unidos tiene la llave de los tres primeros por la propiedad intelectual; China es fuerte en el cuarto.</desc>
  <defs>
    <g id="lock">
      <path d="M2.5 6 v-3 a3.5 3.5 0 0 1 7 0 v3" fill="none" stroke="#b03a2e" stroke-width="2"/>
      <rect x="0" y="5.5" width="12" height="10" rx="2" fill="#b03a2e"/>
    </g>
  </defs>
  <rect width="1000" height="570" fill="#ffffff"/>

  <text x="500" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1b2631">La red global de los chips: cuatro pasos y quién tiene la llave</text>
  <text x="500" y="57" text-anchor="middle" font-size="12.5" fill="#566573">Ningún país hace todo: cada uno monopoliza una parte del proceso (p. 57). Quien controla la propiedad intelectual puede cerrar el paso.</text>

  <!-- 1 · Diseño -->
  <rect x="15" y="80" width="230" height="318" rx="10" fill="#e8eef7" stroke="#2b4c7e" stroke-width="2"/>
  <text x="29" y="107" font-size="15" font-weight="700" fill="#2b4c7e">1 · DISEÑO</text>
  <text x="29" y="126" font-size="12" fill="#566573">Arquitecturas de chip</text>
  <g font-size="12" fill="#1b2631">
    <text x="29" y="156">La arquitectura es propiedad</text>
    <text x="29" y="173">intelectual de empresas de</text>
    <text x="29" y="190">EE. UU., como Intel y AMD.</text>
    <text x="29" y="217">Sobre ella diseñan Apple,</text>
    <text x="29" y="234">Nvidia, Qualcomm o Huawei.</text>
  </g>
  <rect x="27" y="262" width="206" height="62" rx="7" fill="#ffffff" stroke="#2b4c7e" stroke-width="1.3" stroke-dasharray="5 3"/>
  <text x="38" y="284" font-size="12" font-weight="700" fill="#2b4c7e">Salida abierta: RISC-V</text>
  <text x="38" y="302" font-size="11.5" fill="#1b2631">Sin propiedad intelectual vetada.</text>
  <text x="38" y="318" font-size="11.5" fill="#1b2631">XiangShan, 28 nm (pp. 66—67)</text>
  <use href="#lock" x="29" y="360"/>
  <text x="48" y="374" font-size="12.5" font-weight="700" fill="#b03a2e">Llave de EE. UU.</text>

  <!-- 2 · EDA -->
  <rect x="260" y="80" width="230" height="318" rx="10" fill="#e8eef7" stroke="#2b4c7e" stroke-width="2"/>
  <text x="274" y="107" font-size="15" font-weight="700" fill="#2b4c7e">2 · EDA</text>
  <text x="274" y="126" font-size="12" fill="#566573">Software de diseño automático</text>
  <g font-size="12" fill="#1b2631">
    <text x="274" y="156">Programas para definir, planear,</text>
    <text x="274" y="173">diseñar, verificar y mandar a</text>
    <text x="274" y="190">fabricar cada chip.</text>
    <text x="274" y="217" font-weight="700">Synopsys, Cadence y Mentor</text>
    <text x="274" y="234">controlan el 70 % del mercado.</text>
    <text x="274" y="261">Trabajan pegadas a las fábricas:</text>
    <text x="274" y="278">sin ellas, la red no se coordina.</text>
  </g>
  <use href="#lock" x="274" y="360"/>
  <text x="293" y="374" font-size="12.5" font-weight="700" fill="#b03a2e">Llave de EE. UU.</text>

  <!-- 3 · Fabricación -->
  <rect x="505" y="80" width="230" height="318" rx="10" fill="#fbf3dc" stroke="#9a7b0a" stroke-width="2"/>
  <text x="519" y="107" font-size="15" font-weight="700" fill="#7d6408">3 · FABRICACIÓN</text>
  <text x="519" y="126" font-size="12" fill="#566573">El paso más complejo</text>
  <rect x="517" y="138" width="206" height="98" rx="7" fill="#ffffff" stroke="#9a7b0a" stroke-width="1.3"/>
  <g font-size="11.5" fill="#1b2631">
    <text x="528" y="158" font-size="12" font-weight="700" fill="#7d6408">Litografía</text>
    <text x="528" y="177">ASML (Países Bajos): EUV y DUV</text>
    <text x="528" y="194">Nikon y Canon (Japón): solo DUV</text>
    <text x="528" y="211">El EUV nació con propiedad</text>
    <text x="528" y="227">intelectual de EE. UU. (p. 58)</text>
  </g>
  <rect x="517" y="246" width="206" height="86" rx="7" fill="#ffffff" stroke="#9a7b0a" stroke-width="1.3"/>
  <g font-size="11.5" fill="#1b2631">
    <text x="528" y="266" font-size="12" font-weight="700" fill="#7d6408">Fábricas</text>
    <text x="528" y="285">TSMC (Taiwán): las más avanzadas</text>
    <text x="528" y="302">Samsung (Corea del Sur)</text>
    <text x="528" y="319">SMIC (China): 7 nm en 2022</text>
  </g>
  <use href="#lock" x="519" y="360"/>
  <text x="538" y="374" font-size="12.5" font-weight="700" fill="#b03a2e">Llave de EE. UU. y aliados</text>

  <!-- 4 · Prueba y empacado -->
  <rect x="750" y="80" width="230" height="318" rx="10" fill="#e3f2ef" stroke="#0f7a70" stroke-width="2"/>
  <text x="764" y="107" font-size="15" font-weight="700" fill="#0f6a61">4 · PRUEBA Y EMPACADO</text>
  <text x="764" y="126" font-size="12" fill="#566573">Cortar, encapsular, probar</text>
  <g font-size="12" fill="#1b2631">
    <text x="764" y="156">Maquinaria especializada y</text>
    <text x="764" y="173">difícil de operar: los chips</text>
    <text x="764" y="190">son muy delicados.</text>
    <text x="764" y="217" font-weight="700">Aquí China tiene mayores</text>
    <text x="764" y="234" font-weight="700">ventajas e independencia (p. 59).</text>
    <text x="764" y="261">Apilado: varios chips viejos</text>
    <text x="764" y="278">que juntos rinden como uno</text>
    <text x="764" y="295">avanzado (p. 66).</text>
  </g>
  <circle cx="770" cy="369" r="6" fill="#0f7a70"/>
  <text x="783" y="374" font-size="12.5" font-weight="700" fill="#0f6a61">Fuerte de China</text>

  <!-- flechas entre pasos -->
  <g fill="#7f8c8d">
    <polygon points="246,231 258,239 246,247"/>
    <polygon points="491,231 503,239 491,247"/>
    <polygon points="736,231 748,239 736,247"/>
  </g>

  <!-- el mercado -->
  <rect x="15" y="416" width="965" height="58" rx="10" fill="#f4f6f6" stroke="#7f8c8d" stroke-width="1.5"/>
  <text x="497" y="440" text-anchor="middle" font-size="13" font-weight="700" fill="#1b2631">El mercado también es palanca, y apunta al otro lado</text>
  <text x="497" y="460" text-anchor="middle" font-size="12" fill="#1b2631">Qualcomm y Texas Instruments dependen en más de 50 % de sus ventas del mercado chino; esas ganancias pagan la I+D que mantiene la ventaja (p. 59).</text>

  <!-- el corte de 2022 -->
  <rect x="15" y="488" width="965" height="44" rx="10" fill="#fbe3e1" stroke="#b03a2e" stroke-width="1.5"/>
  <text x="497" y="515" text-anchor="middle" font-size="12.5" font-weight="700" fill="#b03a2e">Octubre de 2022: EE. UU. cierra los pasos 1, 2 y 3 a China en todo lo que sirva para fabricar chips lógicos de 14 nm o menos (p. 61).</text>

  <text x="15" y="556" font-size="10.5" fill="#566573">Elaboración para la clase a partir de Rodríguez Urbina (2023), pp. 57—61.</text>
</svg>
